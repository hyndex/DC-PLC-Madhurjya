; PlatformIO project for ESP32-S3 Control Pilot (CP) helper

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform      = espressif32@6.8.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
  bblanchon/ArduinoJson@^6.21.3
  https://github.com/autowp/arduino-mcp2515.git#v1.2.1

# Build flags (merged) and MCP2515 wiring/clock
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D DEBUG
    -DCAN_CS_PIN=13
    -DCAN_RST_PIN=14
    -DCAN_SCK_PIN=7
    -DCAN_MOSI_PIN=15
    -DCAN_MISO_PIN=16
    -DMCP2515_CLK_MHZ=8
