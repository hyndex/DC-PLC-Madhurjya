description: Env-driven external derating provider for DC; sets max current/power via dc_external_derate
provides:
  main:
    interface: empty
    description: No outputs; module pushes dc_external_derate to EvseManager
requires:
  dc_external_derate:
    interface: dc_external_derate
    min_connections: 1
    max_connections: 1
config:
  max_current_a:
    description: Max export current limit (A)
    type: number
    default: 60
  max_voltage_v:
    description: Max export voltage limit (V)
    type: number
    default: 920
  precharge_delta_v:
    description: Allowed delta-V between EV and PSU to finish precharge (V)
    type: number
    default: 20
  precharge_timeout_s:
    description: Precharge timeout (seconds)
    type: number
    default: 10
  contactor_close_timeout_s:
    description: Contactor close timeout (seconds)
    type: number
    default: 2
metadata:
  license: https://opensource.org/licenses/Apache-2.0
  authors:
    - Joulepoint
