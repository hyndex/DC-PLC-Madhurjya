description: C++ HAL adapter bridging EVerest to ESP32-S3 UART (fallback with minimal logic)
name: ESP32HalAdapterCpp
version: 0.0.1
provides:
  evse_board_support:
    interface: evse_board_support
  power_supply_DC:
    interface: power_supply_DC
requires: {}
config:
  tty:
    description: UART device path of ESP32-S3 (e.g., /dev/ttyUSB0)
    type: string
    default: /dev/ttyUSB0
  baud:
    description: Baud rate for UART
    type: integer
    default: 115200
metadata:
  license: https://opensource.org/licenses/Apache-2.0
  authors:
    - Joulepoint

